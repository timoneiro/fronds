name: Server image

on:
  push:
    branches: [main]
    paths: [server/**, src/domain/**, src/db/types.ts, .github/workflows/server-image.yml]
  pull_request:
    paths: [server/**, src/domain/**, src/db/types.ts, .github/workflows/server-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fronds-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Smoke test: the image starts, generates its secrets and answers health checks.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: fronds-server:test
      - name: Smoke test
        run: |
          docker run -d --name fs -p 8787:8787 fronds-server:test
          for i in $(seq 1 20); do curl -fs localhost:8787/api/health && break; sleep 1; done
          curl -fs localhost:8787/api/health
          docker logs fs | grep -q "Server code"
          docker rm -f fs

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
